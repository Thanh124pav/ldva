[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ldva"
version = "0.1.0"
description = "Latent Data Valuation for Budgeted Robot Acquisition"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
logging = ["wandb>=0.16", "pandas>=2.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["ldva*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
